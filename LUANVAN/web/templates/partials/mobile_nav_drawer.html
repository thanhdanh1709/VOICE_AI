{% set mob = mob_nav_active|default('') %}
<div id="mobileNavOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden" onclick="closeMobileNav()"></div>
<div id="mobileNavDrawer" class="vv-mobile-drawer fixed left-0 right-0 z-40 bg-[#0a1929] border-b border-white/10 shadow-2xl hidden md:hidden">
  <div class="flex flex-col p-3 gap-0.5 max-h-[80vh] overflow-y-auto">
    <a href="{{ url_for('index') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'index' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">graphic_eq</span>
      <span data-i18n="nav.home">Workspace</span>
    </a>
    <a href="{{ url_for('audio_library') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'audio_library' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">library_music</span>
      <span data-i18n="mob.library">Thư viện Audio</span>
    </a>
    <a href="{{ url_for('my_voices') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'my_voices' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">record_voice_over</span>
      <span data-i18n="mob.voices">Giọng của tôi</span>
    </a>
    <a href="{{ url_for('history') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'history' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">history</span>
      <span data-i18n="mob.history">Lịch sử</span>
    </a>
    <a href="{{ url_for('pricing') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'pricing' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">bolt</span>
      <span data-i18n="mob.pricing">Bảng giá</span>
    </a>
    <a href="{{ url_for('profile') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'profile' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">manage_accounts</span>
      <span data-i18n="side.profile">Hồ sơ</span>
    </a>
    <a href="{{ url_for('contact') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm {{ 'font-semibold text-primary bg-primary/10' if mob == 'contact' else 'font-medium text-slate-300 hover:text-white hover:bg-white/5' }} no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">help_outline</span>
      <span data-i18n="mob.contact">Liên hệ</span>
    </a>
    {% if session.user_role == 'admin' %}
    <a href="{{ url_for('admin') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-tertiary hover:text-white hover:bg-white/5 no-underline">
      <span class="material-symbols-outlined" style="font-size:20px">admin_panel_settings</span>
      <span data-i18n="nav.admin">Admin</span>
    </a>
    {% endif %}
    <div class="border-t border-white/10 mt-1 pt-1">
      <a href="{{ url_for('logout') }}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-red-400 hover:bg-red-500/10 no-underline">
        <span class="material-symbols-outlined" style="font-size:20px">logout</span>
        <span data-i18n="mob.logout">Đăng xuất</span>
      </a>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/mobile-nav.js') }}?v=20260626"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('#mobileNavDrawer a').forEach(function (link) {
    link.addEventListener('click', function () {
      if (typeof closeMobileNav === 'function') closeMobileNav();
    });
  });
});
</script>
