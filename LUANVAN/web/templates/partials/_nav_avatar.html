{% if session.avatar_url %}
<img src="{{ session.avatar_url }}" alt="" class="w-8 h-8 rounded-full object-cover shrink-0 nav-user-avatar" id="navAvatarImg"/>
{% else %}
<div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary-container to-inverse-primary flex items-center justify-center text-sm font-bold text-on-primary shrink-0 nav-user-avatar-fallback" id="navAvatarFallback">
  {{ (session.full_name or session.username or 'U')[0] | upper }}
</div>
{% endif %}
