<div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-surface-container-low to-surface-container-lowest p-8 items-center justify-center relative overflow-hidden border-r border-outline-variant/30">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(208,188,255,0.05)_0%,transparent_70%)]"></div>
    <div class="relative z-10 text-center space-y-6 px-8">
        <div class="visual-float mb-6">
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
                <svg class="w-56 h-56 text-primary relative z-10 mx-auto" fill="none" stroke="currentColor" stroke-width="0.5" viewBox="0 0 24 24" aria-hidden="true">
                    <circle class="opacity-20" cx="12" cy="12" r="9"></circle>
                    <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z" stroke-dasharray="1 3"></path>
                    <rect fill="currentColor" height="10" rx="0.5" width="1" x="11.5" y="7">
                        <animate attributeName="height" dur="2s" repeatCount="indefinite" values="4;10;6;8;4"></animate>
                    </rect>
                    <rect fill="currentColor" height="6" rx="0.5" width="1" x="9.5" y="9">
                        <animate attributeName="height" dur="1.8s" repeatCount="indefinite" values="2;6;4;5;2"></animate>
                    </rect>
                    <rect fill="currentColor" height="8" rx="0.5" width="1" x="13.5" y="8">
                        <animate attributeName="height" dur="2.2s" repeatCount="indefinite" values="3;8;5;7;3"></animate>
                    </rect>
                    <rect fill="currentColor" height="4" rx="0.5" width="1" x="7.5" y="10">
                        <animate attributeName="height" dur="1.5s" repeatCount="indefinite" values="1;4;2;3;1"></animate>
                    </rect>
                    <rect fill="currentColor" height="4" rx="0.5" width="1" x="15.5" y="10">
                        <animate attributeName="height" dur="1.7s" repeatCount="indefinite" values="1;4;2;3;1"></animate>
                    </rect>
                </svg>
            </div>
        </div>
        <h3 class="text-headline-sm text-on-surface">
            {% block auth_visual_title %}Công nghệ AI hàng đầu{% endblock %}
        </h3>
        <p class="text-body-md text-on-surface-variant max-w-sm mx-auto leading-relaxed">
            {% block auth_visual_desc %}Khám phá sức mạnh của tổng hợp giọng nói tiếng Việt tự nhiên với VietVoice AI. Chuyên nghiệp, cảm xúc và linh hoạt.{% endblock %}
        </p>
    </div>
    <div class="absolute bottom-0 left-0 w-full opacity-10 pointer-events-none">
        <svg class="w-full" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path d="M0,192L48,176C96,160,192,128,288,128C384,128,480,160,576,186.7C672,213,768,235,864,224C960,213,1056,171,1152,144C1248,117,1344,107,1392,101.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z" fill="#d0bcff"></path>
        </svg>
    </div>
</div>
