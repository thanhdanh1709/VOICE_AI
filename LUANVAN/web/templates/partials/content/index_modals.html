<!-- ═══ VOICE PICKER MODAL ═══ -->
<div id="voiceGalleryModal" class="vv-voice-picker-modal" role="dialog" aria-modal="true" aria-labelledby="vpTitle">
  <div class="vp-panel">
    <div class="vp-header">
      <div>
        <h2 id="vpTitle" class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary" style="font-size:20px">library_music</span>
          <span data-i18n="gallery.title">Thư viện giọng đọc</span>
        </h2>
        <p class="vp-subtitle" data-i18n="gallery.subtitle">Nghe thử và chọn giọng đọc phù hợp với nội dung của bạn</p>
      </div>
      <button type="button" class="vp-close close-voice-gallery" aria-label="Đóng">
        <span class="material-symbols-outlined" style="font-size:22px">close</span>
      </button>
    </div>

    <div class="vp-toolbar">
      <div class="vp-search-wrap">
        <span class="material-symbols-outlined">search</span>
        <input type="search" id="vpSearchInput" class="vp-search" data-i18n-placeholder="gallery.search.placeholder" placeholder="Tìm giọng đọc..." autocomplete="off"/>
      </div>
      <div class="vp-chips" id="vpChips">
        <button type="button" class="vp-chip is-active" data-vp-filter="gender" data-value="all" data-i18n="gallery.filter.all">Tất cả</button>
        <button type="button" class="vp-chip" data-vp-filter="gender" data-value="male" data-i18n="gallery.filter.male">Nam</button>
        <button type="button" class="vp-chip" data-vp-filter="gender" data-value="female" data-i18n="gallery.filter.female">Nữ</button>
        <button type="button" class="vp-chip" data-vp-filter="region" data-value="north" data-i18n="gallery.filter.north">Miền Bắc</button>
        <button type="button" class="vp-chip" data-vp-filter="region" data-value="south" data-i18n="gallery.filter.south">Miền Nam</button>
        <button type="button" class="vp-chip" data-vp-filter="fav" data-value="1" data-i18n="gallery.favorites">Yêu thích</button>
      </div>
    </div>

    <div class="vp-tabs">
      <button type="button" class="vp-tab is-active" data-vp-tab="system" data-i18n="gallery.tab.system">Giọng hệ thống</button>
      <button type="button" class="vp-tab" id="vpTabCustom" data-vp-tab="custom" data-i18n="gallery.tab.custom">Giọng của tôi</button>
    </div>

    <div class="vp-body">
      <div id="voiceGalleryGrid" class="vp-grid">
        <div class="vp-loading">
          <div class="vv-spinner" style="margin:0 auto 0.75rem"></div>
          <span data-i18n="gallery.loading">Đang tải danh sách giọng...</span>
        </div>
      </div>
    </div>

    <div class="vp-footer">
      <p class="vp-footer__label" id="vpSelectedLabel" data-i18n="gallery.select_hint">Chọn một giọng để tiếp tục</p>
      <div class="vp-footer__actions">
        <button type="button" class="vp-btn vp-btn--ghost" id="vpCancelBtn" data-i18n="gallery.cancel">Huỷ</button>
        <button type="button" class="vp-btn vp-btn--primary" id="vpConfirmBtn" disabled data-i18n="gallery.btn.use_voice">Dùng giọng này</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ TEXT NORMALIZATION PREVIEW MODAL ═══ -->
<div id="tnPreviewModal" class="hidden fixed inset-0 z-[120] flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="tnPreviewTitle">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="tnPreviewBackdrop"></div>
  <div class="relative w-full max-w-2xl rounded-2xl border border-white/10 bg-surface-container-high shadow-2xl overflow-hidden">
    <div class="flex items-center justify-between px-5 py-4 border-b border-white/10">
      <h3 id="tnPreviewTitle" class="text-base font-bold text-on-surface flex items-center gap-2">
        <span class="material-symbols-outlined text-primary" style="font-size:20px">spellcheck</span>
        Văn bản sau chuẩn hóa (TN)
      </h3>
      <button type="button" id="tnPreviewClose" class="text-on-surface-variant hover:text-on-surface" aria-label="Đóng">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="p-5 space-y-4 max-h-[70vh] overflow-y-auto">
      <div>
        <div class="text-xs font-semibold text-on-surface-variant uppercase tracking-wide mb-2">Gốc</div>
        <div id="tnPreviewOriginal" class="text-sm text-on-surface-variant whitespace-pre-wrap rounded-xl bg-surface-container-lowest border border-white/5 p-3"></div>
      </div>
      <div>
        <div class="text-xs font-semibold text-primary uppercase tracking-wide mb-2">Sau chuẩn hóa</div>
        <textarea id="tnPreviewNormalized" readonly rows="6"
          class="w-full text-sm text-on-surface bg-surface-container-lowest border border-primary/20 rounded-xl p-3 resize-none focus:outline-none"></textarea>
      </div>
      <p id="tnPreviewStatus" class="text-xs text-on-surface-variant"></p>
    </div>
  </div>
</div>
