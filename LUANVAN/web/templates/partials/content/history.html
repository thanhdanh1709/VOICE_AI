<!-- Header -->
    <header class="flex flex-col gap-1">
      <h1 class="text-2xl md:text-3xl font-extrabold text-on-surface tracking-tight" data-i18n="hist.title">Lịch sử chuyển đổi</h1>
      <p class="text-xs md:text-sm text-on-surface-variant" data-i18n="hist.subtitle">Quản lý, theo dõi và tải xuống các tệp âm thanh đã được tổng hợp từ văn bản.</p>
    </header>

    <!-- Controls Toolbar -->
    <div class="flex flex-col gap-2">
      <!-- Search -->
      <div class="relative w-full">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" style="font-size:18px">search</span>
        <input id="searchInput" type="text"
          class="w-full bg-surface-container border border-outline-variant text-on-surface rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-outline/60"
          placeholder="Tìm kiếm văn bản hoặc ID..." data-i18n-placeholder="hist.search_placeholder"/>
      </div>
      <!-- Buttons -->
      <div class="flex items-center gap-2">
        <button id="searchBtn"
          class="flex items-center gap-1.5 px-4 py-2.5 bg-primary/10 border border-primary/30 rounded-lg hover:bg-primary/20 transition-colors text-primary text-sm font-semibold">
          <span class="material-symbols-outlined" style="font-size:18px">filter_list</span>
          <span data-i18n="hist.btn.search">Tìm kiếm</span>
        </button>
        <button onclick="resetSearch()"
          class="flex items-center gap-1.5 px-4 py-2.5 bg-surface-container border border-outline-variant rounded-lg hover:bg-surface-container-high transition-colors text-on-surface-variant text-sm font-medium">
          <span class="material-symbols-outlined" style="font-size:18px">restart_alt</span>
          <span data-i18n="common.reset">Đặt lại</span>
        </button>
        <!-- Total badge -->
        <div class="ml-auto flex items-center gap-1.5 bg-surface-container border border-outline-variant/50 rounded-full px-3 py-1.5 text-xs font-semibold text-on-surface-variant">
          <span class="material-symbols-outlined" style="font-size:13px">list_alt</span>
          <strong id="totalRecords" class="text-on-surface">0</strong>
        </div>
      </div>
    </div>

    <!-- Table Card -->
    <div class="w-full bg-surface/40 backdrop-blur-xl border border-outline-variant/30 rounded-xl overflow-hidden shadow-[0_8px_32px_rgba(0,0,0,0.25)]">
      <div class="overflow-x-auto w-full">
        <table class="w-full text-left">
          <thead class="bg-surface-container/80 border-b border-outline-variant/50">
            <tr>
              <th class="px-3 md:px-5 py-3 text-xs font-semibold uppercase tracking-wide text-on-surface-variant w-16 md:w-24">ID</th>
              <th class="px-3 md:px-5 py-3 text-xs font-semibold uppercase tracking-wide text-on-surface-variant" data-i18n="hist.col.text">Văn bản</th>
              <th class="hidden sm:table-cell px-3 md:px-5 py-3 text-xs font-semibold uppercase tracking-wide text-on-surface-variant" data-i18n="hist.col.voice">Giọng đọc</th>
              <th class="px-3 md:px-5 py-3 text-xs font-semibold uppercase tracking-wide text-on-surface-variant" data-i18n="hist.col.status">Trạng thái</th>
              <th class="hidden md:table-cell px-3 md:px-5 py-3 text-xs font-semibold uppercase tracking-wide text-on-surface-variant" data-i18n="hist.col.time">Thời gian</th>
              <th class="px-3 md:px-5 py-3 text-xs font-semibold uppercase tracking-wide text-on-surface-variant text-right" data-i18n="hist.col.actions">Thao tác</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-outline-variant/20">
            <tr>
              <td colspan="6" class="px-5 py-14 text-center">
                <div class="flex flex-col items-center gap-3 text-on-surface-variant">
                  <div style="width:28px;height:28px;border:3px solid rgba(208,188,255,0.15);border-top-color:#d0bcff;border-radius:50%;animation:spin 0.8s linear infinite"></div>
                  <p class="text-sm" data-i18n="hist.loading">Đang tải dữ liệu...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Empty State (hidden initially, shown by JS) -->
      <div id="emptyHistoryState" class="hidden flex-col items-center justify-center py-20 gap-4 text-on-surface-variant">
        <span class="material-symbols-outlined" style="font-size:56px;opacity:0.3">history</span>
        <div class="text-center">
          <p class="text-base font-semibold text-on-surface" data-i18n="hist.empty.title">Chưa có lịch sử</p>
          <p class="text-sm mt-1" data-i18n="hist.empty.desc">Các lần chuyển đổi của bạn sẽ xuất hiện ở đây</p>
        </div>
        <a href="{{ url_for('index') }}" class="mt-1 px-5 py-2.5 rounded-xl bg-primary/15 border border-primary/30 text-primary text-sm font-semibold hover:bg-primary/25 transition-colors no-underline flex items-center gap-2">
          <span class="material-symbols-outlined" style="font-size:16px">add_circle</span>
          <span data-i18n="hist.empty.cta">Tạo Audio đầu tiên</span>
        </a>
      </div>

      <!-- Pagination footer -->
      <div class="px-5 py-3.5 border-t border-outline-variant/30 bg-surface-container/30 flex items-center justify-between gap-4 flex-wrap">
        <span id="paginationInfo" class="text-xs text-on-surface-variant">—</span>
        <div id="pagination" class="flex items-center gap-1.5"></div>
      </div>
    </div>
